<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#F0FBFD" rx="16"/>
  <!-- Window frame -->
  <rect x="90" y="70" width="220" height="170" rx="8" fill="#fff" stroke="#3EC1D3" stroke-width="4"/>
  <!-- Window cross bars -->
  <line x1="200" y1="70" x2="200" y2="240" stroke="#3EC1D3" stroke-width="3"/>
  <line x1="90" y1="155" x2="310" y2="155" stroke="#3EC1D3" stroke-width="3"/>
  <!-- Glass shine -->
  <path d="M105 85 Q130 95 125 120" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M215 85 Q240 95 235 120" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <!-- Squeegee -->
  <rect x="290" y="90" width="12" height="80" rx="4" fill="#9CA3AF"/>
  <rect x="280" y="90" width="32" height="10" rx="5" fill="#3EC1D3"/>
  <!-- Water streaks -->
  <line x1="298" y1="100" x2="296" y2="165" stroke="#3EC1D3" stroke-width="2" opacity="0.4"/>
  <line x1="303" y1="100" x2="301" y2="165" stroke="#3EC1D3" stroke-width="2" opacity="0.3"/>
  <!-- Sparkle -->
  <text x="200" y="50" text-anchor="middle" font-size="20">🪟</text>
  <circle cx="145" cy="115" r="5" fill="none" stroke="#3EC1D3" stroke-width="1.5" opacity="0.5"/>
  <circle cx="255" cy="100" r="4" fill="none" stroke="#3EC1D3" stroke-width="1.5" opacity="0.4"/>
  <!-- Caption -->
  <text x="200" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Mytí oken</text>
  <text x="200" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">Lesklá čistá skla</text>
</svg>
