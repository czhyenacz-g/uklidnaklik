<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#F0FBFD" rx="16"/>
  <!-- Steam cleaner body -->
  <rect x="140" y="130" width="80" height="100" rx="16" fill="#fff" stroke="#3EC1D3" stroke-width="3"/>
  <rect x="148" y="138" width="64" height="60" rx="10" fill="#E0F7FA"/>
  <!-- Water level indicator -->
  <rect x="156" y="148" width="12" height="40" rx="4" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="1"/>
  <rect x="156" y="168" width="12" height="20" rx="3" fill="#3EC1D3" opacity="0.7"/>
  <!-- Power indicator -->
  <circle cx="196" cy="158" r="10" fill="#3EC1D3"/>
  <text x="196" y="162" text-anchor="middle" font-size="12" fill="#fff">⚡</text>
  <!-- Hose from top -->
  <path d="M180 130 Q180 100 200 85" fill="none" stroke="#9CA3AF" stroke-width="6" stroke-linecap="round"/>
  <!-- Steam nozzle -->
  <rect x="183" y="72" width="34" height="18" rx="6" fill="#3EC1D3"/>
  <!-- Steam clouds -->
  <ellipse cx="225" cy="52" rx="16" ry="10" fill="none" stroke="#3EC1D3" stroke-width="2" opacity="0.5"/>
  <ellipse cx="245" cy="42" rx="12" ry="8" fill="none" stroke="#3EC1D3" stroke-width="2" opacity="0.4"/>
  <ellipse cx="260" cy="55" rx="10" ry="7" fill="none" stroke="#3EC1D3" stroke-width="2" opacity="0.35"/>
  <ellipse cx="242" cy="62" rx="8" ry="6" fill="none" stroke="#3EC1D3" stroke-width="2" opacity="0.3"/>
  <!-- Wheels -->
  <circle cx="155" cy="225" r="10" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="2"/>
  <circle cx="205" cy="225" r="10" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="2"/>
  <!-- Temperature badge -->
  <rect x="245" y="150" width="70" height="28" rx="12" fill="#3EC1D3"/>
  <text x="280" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff">160 °C</text>
  <!-- Caption -->
  <text x="200" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Parní čistič</text>
  <text x="200" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">Hloubková dezinfekce</text>
</svg>
