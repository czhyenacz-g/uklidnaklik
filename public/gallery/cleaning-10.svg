  <circle cx="268" cy="225" r="3.5" fill="#D1D5DB" opacity="0.4"/>
  <circle cx="290" cy="215" r="2.5" fill="#D1D5DB" opacity="0.5"/>
  <!-- Hard hat -->
  <path d="M80 120 Q80 90 115 85 Q150 80 165 95 Q180 85 200 88 Q220 90 225 105 L225 120 Z" fill="#F59E0B"/>
  <rect x="72" y="118" width="160" height="12" rx="5" fill="#F59E0B"/>
  <rect x="90" y="118" width="130" height="8" rx="3" fill="#FBBF24"/>
  <!-- Hard hat shine -->
  <path d="M100 95 Q115 88 130 92" fill="none" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- Badge: Stavební úklid -->
  <rect x="270" y="100" width="90" height="28" rx="12" fill="#3EC1D3"/>
  <text x="315" y="119" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">Stavební</text>
  <!-- Caption -->
  <text x="200" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Stavební úklid</text>
  <text x="200" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">Po rekonstrukci</text>
