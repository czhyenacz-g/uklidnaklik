  <line x1="193" y1="215" x2="190" y2="230" stroke="#2BA8BB" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="202" y1="218" x2="200" y2="233" stroke="#2BA8BB" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="211" y1="220" x2="211" y2="235" stroke="#2BA8BB" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="220" y1="220" x2="222" y2="235" stroke="#2BA8BB" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="229" y1="218" x2="233" y2="232" stroke="#2BA8BB" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="238" y1="214" x2="244" y2="228" stroke="#2BA8BB" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Dust particles sweeping -->
  <circle cx="260" cy="218" r="5" fill="#D1D5DB" opacity="0.7"/>
  <circle cx="272" cy="212" r="4" fill="#D1D5DB" opacity="0.5"/>
